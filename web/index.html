<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>War in Middle Earth</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* Settings may shrink it to 75% or 50%, centred. */
      canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
        touch-action: none;
      }
      /* The Atlas map fills the window under the game's canvas, whatever
         its size; the game's canvas takes all input
         (docs/spec/atlas-map.md). */
      #atlas-map,
      #atlas-debug {
        top: 0;
        left: 0;
        transform: none;
        display: none;
        image-rendering: auto;
        pointer-events: none;
      }
      /* Opens the in-game menu, as Escape does (docs/spec/game-menu.md). */
      #menu {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 2px 8px;
        border: 1px solid #442266;
        border-radius: 2px;
        background: #ddccaa;
        color: #446666;
        font: 12px monospace;
        opacity: 0.6;
        cursor: pointer;
      }
      #menu:hover {
        opacity: 1;
      }
      #status {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        color: #fff;
        font: 12px monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="atlas-map"></canvas>
    <canvas id="atlas-debug"></canvas>
    <canvas id="screen"></canvas>
    <pre id="status"></pre>
    <button id="menu" type="button" hidden>Menu</button>
    <script type="module" src="/src/view/main.ts"></script>
  </body>
</html>
